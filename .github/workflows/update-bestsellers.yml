name: Update Bestseller Charts

on:
  schedule:
    # Runs every day at 7am UTC (3am Eastern / midnight Pacific)
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Also allows manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run update script
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: python3 scripts/update_bestsellers.py

      - name: Commit and push if changed
        run: |
          git config user.name  "Audiobooks.org Bot"
          git config user.email "bot@audiobooks.org"
          git add bestsellers.html
          git diff --staged --quiet || git commit -m "chore: update bestseller charts $(date +'%Y-%m-%d')"
          git push
